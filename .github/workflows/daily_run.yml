name: Daily Job Search

on:
  schedule:
    # 8:00 AM Eastern ≈ 12:00/13:00 UTC depending on DST — runs at 12:00 UTC daily
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit updated dashboard/seen_jobs/tailored resumes back to the repo

jobs:
  run-jobpilot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JobPilot
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Commit updated dashboard, tailored resumes, and dedupe state
        run: |
          git config user.name "jobpilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ data/seen_jobs.json output/ 2>/dev/null || true
          git diff --quiet --cached || git commit -m "JobPilot: daily run $(date -u +%Y-%m-%d)"
          git push
